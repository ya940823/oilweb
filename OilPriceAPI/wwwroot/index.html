<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣油價觀察與預測系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <header class="py-4 mb-4 border-bottom">
            <div class="container">
                <h1 class="display-4 text-center">🛢️ 台灣油價觀察與預測系統</h1>
                <p class="text-center text-muted">Oil Price Monitoring & Prediction System</p>
            </div>
        </header>

        <div class="container">
            <!-- XML Upload Section -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">📁 上傳油價 XML 資料</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <input type="file" class="form-control" id="xmlFileInput" accept=".xml">
                            </div>
                            <button class="btn btn-primary" onclick="uploadXmlFile()">
                                <span class="spinner-border spinner-border-sm d-none" id="uploadSpinner"></span>
                                上傳並解析
                            </button>
                            <div id="uploadResult" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Latest Oil Prices -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-success text-white">
                            <h5 class="mb-0">📊 最新油價資訊</h5>
                        </div>
                        <div class="card-body">
                            <div class="row" id="latestPrices">
                                <div class="col-12 text-center">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">載入中...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Statistics -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-info text-white">
                            <h5 class="mb-0">📈 統計資訊 (最近 30 天)</h5>
                        </div>
                        <div class="card-body">
                            <div id="statistics">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">載入中...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Price Chart -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-warning">
                            <h5 class="mb-0">📉 油價走勢圖</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <button class="btn btn-sm btn-outline-primary" onclick="loadChartData(7)">7天</button>
                                <button class="btn btn-sm btn-outline-primary active" onclick="loadChartData(30)">30天</button>
                                <button class="btn btn-sm btn-outline-primary" onclick="loadChartData(90)">90天</button>
                            </div>
                            <canvas id="priceChart" height="80"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- History Table -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-secondary text-white">
                            <h5 class="mb-0">📋 歷史資料</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th>日期</th>
                                            <th>92 無鉛</th>
                                            <th>95 無鉛</th>
                                            <th>98 無鉛</th>
                                            <th>柴油</th>
                                            <th>資料來源</th>
                                        </tr>
                                    </thead>
                                    <tbody id="historyTable">
                                        <tr>
                                            <td colspan="6" class="text-center">
                                                <div class="spinner-border text-primary" role="status">
                                                    <span class="visually-hidden">載入中...</span>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="py-4 mt-4 border-top bg-light">
            <div class="container text-center">
                <p class="text-muted mb-0">© 2024 台灣油價觀察系統 | Built with ASP.NET Core & SQL Server</p>
            </div>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
