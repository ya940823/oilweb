<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣汽油油價走勢分析</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🛢️ 台灣汽油油價走勢分析</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row" id="latestPrices">
            <!-- Latest prices cards will be inserted here -->
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">油價走勢圖</h5>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="loadChart(7)">7天</button>
                            <button type="button" class="btn btn-outline-primary btn-sm active" onclick="loadChart(30)">30天</button>
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="loadChart(90)">90天</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <canvas id="priceChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">統計資訊</h5>
                    </div>
                    <div class="card-body">
                        <div id="statistics">
                            <!-- Statistics will be inserted here -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">資料匯出</h5>
                    </div>
                    <div class="card-body">
                        <p>匯出歷史油價資料為 CSV 格式</p>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-success btn-sm" onclick="exportData(7)">匯出7天</button>
                            <button type="button" class="btn btn-success btn-sm" onclick="exportData(30)">匯出30天</button>
                            <button type="button" class="btn btn-success btn-sm" onclick="exportData(90)">匯出90天</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-5 py-3 bg-light">
        <div class="container text-center">
            <p class="text-muted mb-0">資料來源：政府資料開放平台</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
