<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣油價走勢分析</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container-fluid">
        <header class="py-4 mb-4 border-bottom">
            <h1 class="text-center">台灣油價走勢分析</h1>
            <p class="text-center text-muted">即時油價查詢與未來30天預測</p>
        </header>

        <div class="row mb-4">
            <div class="col-12">
                <div class="alert alert-info">
                    <strong>預測說明：</strong> 圖表中虛線部分為基於歷史資料的30天價格預測，僅供參考。
                </div>
            </div>
        </div>

        <!-- Latest Prices -->
        <div class="row mb-4" id="latestPrices">
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">92無鉛</h6>
                        <h3 class="card-title" id="price92">--</h3>
                        <p class="card-text small" id="change92"></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">95無鉛</h6>
                        <h3 class="card-title" id="price95">--</h3>
                        <p class="card-text small" id="change95"></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">98無鉛</h6>
                        <h3 class="card-title" id="price98">--</h3>
                        <p class="card-text small" id="change98"></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">超級柴油</h6>
                        <h3 class="card-title" id="priceDiesel">--</h3>
                        <p class="card-text small" id="changeDiesel"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chart Controls -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-primary" onclick="loadChart(7)">7天</button>
                    <button type="button" class="btn btn-outline-primary active" onclick="loadChart(30)">30天</button>
                    <button type="button" class="btn btn-outline-primary" onclick="loadChart(90)">90天</button>
                </div>
                <button type="button" class="btn btn-success float-end" onclick="refreshData()">
                    <span id="refreshIcon">🔄</span> 更新資料
                </button>
            </div>
        </div>

        <!-- Chart -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <canvas id="priceChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="row mb-4" id="statistics">
            <div class="col-12">
                <h4>統計資訊（最近30天）</h4>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">92無鉛</h6>
                        <p class="mb-1"><small>平均：<span id="stat92Avg">--</span></small></p>
                        <p class="mb-1"><small>最高：<span id="stat92Max">--</span></small></p>
                        <p class="mb-0"><small>最低：<span id="stat92Min">--</span></small></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">95無鉛</h6>
                        <p class="mb-1"><small>平均：<span id="stat95Avg">--</span></small></p>
                        <p class="mb-1"><small>最高：<span id="stat95Max">--</span></small></p>
                        <p class="mb-0"><small>最低：<span id="stat95Min">--</span></small></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">98無鉛</h6>
                        <p class="mb-1"><small>平均：<span id="stat98Avg">--</span></small></p>
                        <p class="mb-1"><small>最高：<span id="stat98Max">--</span></small></p>
                        <p class="mb-0"><small>最低：<span id="stat98Min">--</span></small></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">超級柴油</h6>
                        <p class="mb-1"><small>平均：<span id="statDieselAvg">--</span></small></p>
                        <p class="mb-1"><small>最高：<span id="statDieselMax">--</span></small></p>
                        <p class="mb-0"><small>最低：<span id="statDieselMin">--</span></small></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Export Button -->
        <div class="row mb-4">
            <div class="col-12">
                <button type="button" class="btn btn-secondary" onclick="exportData(30)">匯出30天CSV</button>
                <button type="button" class="btn btn-secondary" onclick="exportData(90)">匯出90天CSV</button>
            </div>
        </div>

        <footer class="py-3 border-top">
            <p class="text-center text-muted">資料來源：政府資料開放平台</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
