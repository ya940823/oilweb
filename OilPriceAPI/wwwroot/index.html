<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣汽油油價走勢分析</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- If CDN is blocked, uncomment the following and download libraries locally -->
    <!-- <link href="css/bootstrap.min.css" rel="stylesheet"> -->
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">⛽ 台灣汽油油價走勢分析系統</a>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Latest Oil Price Display -->
        <div class="row mb-4">
            <div class="col-12">
                <h2>今日油價</h2>
                <div id="latestPriceDate" class="text-muted mb-2"></div>
            </div>
        </div>

        <div class="row mb-4" id="latestPrices">
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">92 無鉛</h5>
                        <h3 class="price" id="gas92Price">--</h3>
                        <p class="change" id="gas92Change"></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">95 無鉛</h5>
                        <h3 class="price" id="gas95Price">--</h3>
                        <p class="change" id="gas95Change"></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">98 無鉛</h5>
                        <h3 class="price" id="gas98Price">--</h3>
                        <p class="change" id="gas98Change"></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">柴油</h5>
                        <h3 class="price" id="dieselPrice">--</h3>
                        <p class="change" id="dieselChange"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chart Controls -->
        <div class="row mb-4">
            <div class="col-12">
                <h2>油價走勢圖</h2>
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-primary active" onclick="loadChart(7)">7 天</button>
                    <button type="button" class="btn btn-outline-primary" onclick="loadChart(30)">30 天</button>
                    <button type="button" class="btn btn-outline-primary" onclick="loadChart(90)">90 天</button>
                </div>
                <button type="button" class="btn btn-success float-end" onclick="exportData()">
                    📥 匯出 CSV
                </button>
            </div>
        </div>

        <!-- Chart -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <canvas id="priceChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="row mb-4">
            <div class="col-12">
                <h2>統計資訊</h2>
                <div id="statistics" class="card">
                    <div class="card-body">
                        <p class="text-muted">載入中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light text-center text-muted py-3 mt-5">
        <div class="container">
            <p>© 2024 台灣汽油油價走勢分析系統 | 資料來源：政府資料開放平台</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
