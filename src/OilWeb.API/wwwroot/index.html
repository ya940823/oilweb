<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣油價查詢平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
</head>
<body>
    <!-- 導航列 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">⛽ 台灣油價查詢平台</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#home">首頁</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#trend">走勢圖</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#history">歷史查詢</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要內容 -->
    <div class="container mt-4">
        <!-- 最新油價顯示 -->
        <section id="home" class="mb-5">
            <h2 class="mb-4">📊 最新油價資訊</h2>
            <div class="row" id="latestPrices">
                <div class="col-12 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">載入中...</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 油價走勢圖 -->
        <section id="trend" class="mb-5">
            <h2 class="mb-4">📈 油價走勢圖</h2>
            <div class="card">
                <div class="card-body">
                    <div class="btn-group mb-3" role="group">
                        <button type="button" class="btn btn-outline-primary" onclick="loadChart(7)">7天</button>
                        <button type="button" class="btn btn-outline-primary active" onclick="loadChart(30)">30天</button>
                        <button type="button" class="btn btn-outline-primary" onclick="loadChart(90)">90天</button>
                    </div>
                    <canvas id="priceChart"></canvas>
                </div>
            </div>
        </section>

        <!-- 歷史資料查詢 -->
        <section id="history" class="mb-5">
            <h2 class="mb-4">🔍 歷史資料查詢</h2>
            <div class="card">
                <div class="card-body">
                    <form id="queryForm" class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">起始日期</label>
                            <input type="date" class="form-control" id="fromDate" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">結束日期</label>
                            <input type="date" class="form-control" id="toDate" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">&nbsp;</label>
                            <button type="submit" class="btn btn-primary w-100">查詢</button>
                        </div>
                    </form>
                    <div class="mt-3">
                        <button class="btn btn-success" onclick="exportCsv()">📥 匯出 CSV</button>
                    </div>
                    <div id="queryResults" class="mt-4"></div>
                </div>
            </div>
        </section>

        <!-- 油價分析 -->
        <section id="analysis" class="mb-5">
            <h2 class="mb-4">📊 油價趨勢分析</h2>
            <div class="card">
                <div class="card-body">
                    <div id="trendAnalysis"></div>
                </div>
            </div>
        </section>

        <!-- 價格預測 -->
        <section id="prediction" class="mb-5">
            <h2 class="mb-4">🔮 價格預測 (線性回歸)</h2>
            <div class="card">
                <div class="card-body">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <select class="form-select" id="oilTypeSelect">
                                <option value="92無鉛汽油">92無鉛汽油</option>
                                <option value="95無鉛汽油">95無鉛汽油</option>
                                <option value="98無鉛汽油">98無鉛汽油</option>
                                <option value="超級柴油">超級柴油</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <button class="btn btn-primary w-100" onclick="loadPrediction()">預測未來價格</button>
                        </div>
                    </div>
                    <div id="predictionResults"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="bg-light text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">© 2025 台灣油價查詢平台 | 資料來源: 政府資料開放平台</p>
            <p class="text-muted small">本系統採用 ASP.NET Core Web API + Entity Framework Core + Chart.js</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
